[project]
name = "marcolens"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fredapi>=0.5.2",
    "google-genai>=1.74.0",
    "gradio>=6.14.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openai>=2.34.0",
    "pandas>=2.3.3",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sec-edgar-downloader>=5.1.0",
    "sec-parser>=0.58.1",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.46.0",
    "yfinance>=0.2.50",
    "markdown>=3.7",
    "langfuse>=4.14.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "docs/html", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # 行长由 formatter 控制，不做硬性报错
    "E402",  # 脚本入口普遍在 sys.path.insert / load_dotenv 之后再 import，属项目约定
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # yfinance / fredapi / sec_edgar 等无类型 stub
check_untyped_defs = true
exclude = ["\\.venv", "docs/", "migrations/"]
