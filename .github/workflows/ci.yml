name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Unit tests (mock LLM, no external API/DB)
        run: uv run pytest tests/test_new_components.py -q
